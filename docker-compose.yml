services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: matchguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Optional: FEEDBACK_EXTRACTOR / GEMINI_* / OPENAI_* from backend/.env (never baked into the image).
    # Without the file the API still starts (gemini, no key: analysis returns 503).
    # `required: false` needs Compose v2.24+.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/matchguard
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
